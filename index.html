<!DOCTYPE html>
<html>
<head>
<title>Team Single Empire</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body { 
        font-family: Arial; 
        background: #0A0A0A; 
        color: #D4AF37; 
        padding: 20px; 
        text-align: center;
    }
   .card { 
        background: #111; 
        padding: 20px; 
        border: 2px solid #D4AF37; 
        border-radius: 10px; 
        max-width: 400px; 
        margin: 20px auto; 
    }
    h1 { font-size: 24px; }
    input, button { 
        width: 90%; 
        padding: 12px; 
        margin: 8px 0; 
        border-radius: 5px; 
        border: 1px solid #D4AF37; 
    }
    input { background: #222; color: white; }
    button { 
        background: #D4AF37; 
        color: #0A0A0A; 
        font-weight: bold; 
        cursor: pointer; 
    }
   .hidden { display: none; }
    img { 
        width: 100px; 
        height: 120px; 
        border: 2px solid #D4AF37; 
        object-fit: cover; 
        margin: 10px 0;
    }
</style>
</head>
<body>

<div class="card" id="formDiv">
    <h1>👑 TEAM SINGLE EMPIRE 👑</h1>
    <p>Royal eCitizen Portal</p>
    
    <input type="text" id="jina" placeholder="Jina Lako">
    <input type="text" id="oshwa" placeholder="Mwaka Ulipotemwa">
    <input type="text" id="embassy" placeholder="Embassy Yako">
    <input type="file" id="photo" accept="image/*">
    
    <button onclick="tengenezaPassport()">CLAIM CITIZENSHIP</button>
</div>

<div class="card hidden" id="passportDiv">
    <h1>👑 PASSPORT DECREED 👑</h1>
    <img id="pichaYangu" src="">
    <p><b>PASSPORT NO:</b> <span id="passNo"></span></p>
    <p><b>JINA:</b> <span id="passJina"></span></p>
    <p><b>STATUS:</b> Certified Single ✅</p>
    <p><b>EMBASSY:</b> <span id="passEmbassy"></span></p>
    <p><b>LAST BETRAYAL:</b> <span id="passOshwa"></span> 💀</p>
    
    <button onclick="location.reload()">NEW APPLICATION</button>
</div>

<script>
let passportCounter = 5;

function tengenezaPassport() {
    alert('Button inafanya! Generating...');
    
    var jina = document.getElementById('jina').value;
    var oshwa = document.getElementById('oshwa').value;
    var embassy = document.getElementById('embassy').value;
    var photoInput = document.getElementById('photo');
    
    if (jina === '' || oshwa === '' || embassy === '') {
        alert('Jaza zote King!');
        return;
    }
    
    passportCounter = passportCounter + 1;
    var passNo = 'TSE00' + passportCounter;
    
    if (photoInput.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            onyeshaPassport(passNo, jina, oshwa, embassy, e.target.result);
        };
        reader.readAsDataURL(photoInput.files[0]);
    } else {
        onyeshaPassport(passNo, jina, oshwa, embassy, '');
    }
}

function onyeshaPassport(passNo, jina, oshwa, embassy, picha) {
    document.getElementById('formDiv').classList.add('hidden');
    document.getElementById('passportDiv').classList.remove('hidden');
    
    document.getElementById('passNo').innerText = passNo;
    document.getElementById('passJina').innerText = jina;
    document.getElementById('passEmbassy').innerText = embassy;
    document.getElementById('passOshwa').innerText = oshwa;
    
    if (picha!== '') {
        document.getElementById('pichaYangu').src = picha;
    } else {
        document.getElementById('pichaYangu').src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pcaAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABGSURBVHhe7cExAQAAAMKg9U9tCy8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPyrBfQAAQHjZscAAAAASUVORK5CYII=';
    }
}
</script>

</body>
</html>
