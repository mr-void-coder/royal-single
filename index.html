<!DOCTYPE html>
<html>
<head>
<title>Team Single Empire - Royal Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root { --gold: #D4AF37; --black: #0A0A0A; }
    * { box-sizing: border-box; }
    body { font-family: 'Montserrat'; background: var(--black); color: var(--gold); padding: 15px; max-width: 600px; margin: auto; }
  .royal-card { background: #111; padding: 25px; border-radius: 15px; border: 2px solid var(--gold); margin-bottom: 20px; }
    h1 { font-family: 'Cinzel'; text-align: center; font-size: 28px; }
  .crown-main { font-size: 50px; text-align: center; }
    input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #222; color: white; }
    button { background: var(--gold); color: var(--black); font-weight: 700; cursor: pointer; }
  .hidden { display: none; }
  .flex { display: flex; gap: 20px; }
  .photo-frame { width: 90px; height: 110px; border: 3px solid var(--gold); background: #000; }
</style>
</head>
<body>

<div class="royal-card" id="form">
    <div class="crown-main">👑</div>
    <h1>TEAM SINGLE EMPIRE</h1>
    <p style="text-align:center; font-size:11px;">ROYAL eCITIZEN PORTAL • EST. 2026</p>
    
    <input id="jina" placeholder="Royal Name">
    <input id="oshwa" placeholder="Date of Last Betrayal">
    <input id="embassy" placeholder="Territory • Embassy yako">

    <button type="button" onclick="generate()">👑 CLAIM CITIZENSHIP 👑</button>
</div>

<div class="royal-card hidden" id="passport">
    <div class="crown-main">👑</div>
    <h1>PASSPORT DECREED</h1>
    <div class="flex">
        <div class="photo-frame"></div>
        <div>
            <p><b>PASSPORT NO:</b> <span id="passNo"></span></p>
            <p><b>NAME:</b> <span id="passJina"></span></p>
            <p><b>STATUS:</b> Certified Single ✅</p>
            <p><b>EMBASSY:</b> <span id="passEmbassy"></span></p>
            <p><b>LAST BETRAYAL:</b> <span id="passOshwa"></span> 💀</p>
        </div>
    </div>
    <button type="button" onclick="window.print()">📜 DOWNLOAD</button>
    <button type="button" onclick="location.reload()">NEW APPLICATION</button>
</div>

<script>
let counter = 3;

function generate() {
    const jina = document.getElementById('jina').value;
    const oshwa = document.getElementById('oshwa').value;
    const embassy = document.getElementById('embassy').value;

    if(!jina || !oshwa || !embassy) {
        alert('Jaza zote King! 👑');
        return;
    }

    counter++;
    const passNo = 'TSE' + String(counter).padStart(3, '0');
    
    document.getElementById('passNo').innerText = passNo;
    document.getElementById('passJina').innerText = jina.toUpperCase();
    document.getElementById('passEmbassy').innerText = embassy;
    document.getElementById('passOshwa').innerText = oshwa;

    document.getElementById('form').classList.add('hidden');
    document.getElementById('passport').classList.remove('hidden');
}
</script>

</body>
</html>
