<!DOCTYPE html>
<html>
<head>
<title>Team Single Empire - Royal Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root { --gold: #D4AF37; --black: #0A0A0A; }
    * { box-sizing: border-box; }
    body { font-family: 'Montserrat'; background: var(--black); color: var(--gold); padding: 15px; max-width: 650px; margin: auto; }
.royal-card { background: #111; padding: 25px; border-radius: 15px; border: 2px solid var(--gold); margin-bottom: 20px; }
    h1 { font-family: 'Cinzel'; text-align: center; font-size: 28px; }
.crown-main { font-size: 50px; text-align: center; }
    input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #222; color: white; }
    button { background: var(--gold); color: var(--black); font-weight: 700; cursor: pointer; }
.hidden { display: none; }
.flex { display: flex; gap: 20px; align-items: flex-start; }
.photo-frame { width: 90px; height: 110px; border: 3px solid var(--gold); background: #000; object-fit: cover; }
.preview { width: 60px; height: 60px; border: 1px solid var(--gold); object-fit: cover; margin: 5px 0; }
</style>
</head>
<body>

<div class="royal-card" id="form">
    <div class="crown-main">👑</div>
    <h1>TEAM SINGLE EMPIRE</h1>
    <p style="text-align:center; font-size:11px;">ROYAL eCITIZEN PORTAL • EST. 2026</p>
    
    <input id="jina" placeholder="Royal Name">
    <input id="oshwa" placeholder="Date of Last Betrayal">
    <input id="embassy" placeholder="Territory • Embassy yako">
    <label style="font-size:12px; color:#B8941F;">Official Portrait:</label>
    <input type="file" id="photo" accept="image/*">
    <img id="photoPreview" class="preview hidden">

    <button type="button" id="claimBtn">👑 CLAIM CITIZENSHIP 👑</button>
</div>

<div class="royal-card hidden" id="passport">
    <div class="crown-main">👑</div>
    <h1>PASSPORT DECREED</h1>
    <div class="flex">
        <img id="passPhoto" class="photo-frame" src="">
        <div>
            <p><b>PASSPORT NO:</b> <span id="passNo"></span></p>
            <p><b>NAME:</b> <span id="passJina"></span></p>
            <p><b>STATUS:</b> Certified Single ✅</p>
            <p><b>EMBASSY:</b> <span id="passEmbassy"></span></p>
            <p><b>LAST BETRAYAL:</b> <span id="passOshwa"></span> 💀</p>
        </div>
    </div>
    <button type="button" onclick="window.print()">📜 DOWNLOAD</button>
    <button type="button" onclick="location.reload()">NEW APPLICATION</button>
</div>

<script>
let counter = 5;

// HII NDIO INA-RUN AUTOMATICALLY
document.addEventListener('DOMContentLoaded', function() {
    // Test kama JS inafanya
    console.log('Empire JS Loaded');
    
    document.getElementById('claimBtn').addEventListener('click', generate);
    document.getElementById('photo').addEventListener('change', previewPhoto);
});

function previewPhoto(e) {
    const file = e.target.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('photoPreview').src = event.target.result;
            document.getElementById('photoPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }
}

function generate() {
    // DEBUG ALERT - HII IKITOKA MAANA BUTTON INAFANYA
    alert('Button imebonyezwa! Generating Passport...');
    
    const jina = document.getElementById('jina').value.trim();
    const oshwa = document.getElementById('oshwa').value.trim();
    const embassy = document.getElementById('embassy').value.trim();
    const photoFile = document.getElementById('photo').files[0];

    if(!jina ||!oshwa ||!embassy) {
        alert('By Royal Decree: Jaza zote King! 👑');
        return;
    }

    counter++;
    const passNo = 'TSE' + String(counter).padStart(3, '0');

    if(photoFile) {
        compressImage(photoFile, function(compressedDataUrl) {
            showPassport(passNo, jina, oshwa, embassy, compressedDataUrl);
        });
    } else {
        showPassport(passNo, jina, oshwa, embassy, '');
    }
}

function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxSize = 300;
            let width = img.width;
            let height = img.height;
            if (width > height) {
                if (width > maxSize) { height *= maxSize / width; width = maxSize; }
            } else {
                if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function showPassport(passNo, jina, oshwa, embassy, photoData) {
    document.getElementById('form').classList.add('hidden');
    document.getElementById('passport').classList.remove('hidden');
    document.getElementById('passNo').innerText = passNo;
    document.getElementById('passJina').innerText = jina.toUpperCase();
    document.getElementById('passEmbassy').innerText = embassy;
    document.getElementById('passOshwa').innerText = oshwa;
    document.getElementById('passPhoto').src = photoData || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110"><rect fill="%23111"/><text x="50%" y="50%" fill="%23D4AF37" font-size="10" text-anchor="middle" dy=".3em">SUBJECT</text></svg>';
}
</script>

</body>
</html>
