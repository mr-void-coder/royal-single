<!DOCTYPE html>
<html>
<head>
<title>Team Single Empire - Royal Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root { --gold: #D4AF37; --black: #0A0A0A; --red: #8B0000; }
    * { box-sizing: border-box; }
    body { font-family: 'Montserrat'; background: var(--black); color: var(--gold); padding: 15px; max-width: 650px; margin: auto; }
.royal-card { background: #111; padding: 25px; border-radius: 15px; border: 2px solid var(--gold); margin-bottom: 20px; }
    h1 { font-family: 'Cinzel'; text-align: center; font-size: 28px; }
.crown-main { font-size: 50px; text-align: center; }
    input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #222; color: white; }
    button { background: var(--gold); color: var(--black); font-weight: 700; cursor: pointer; }
.hidden { display: none; }
.flex { display: flex; gap: 20px; align-items: flex-start; }
.photo-frame { width: 90px; height: 110px; border: 3px solid var(--gold); background: #000; object-fit: cover; }
.stats { text-align: center; font-size: 14px; margin: 10px 0; color: #B8941F; }
    table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 15px; }
    td, th { border: 1px solid #B8941F; padding: 8px; text-align: left; }
.admin-btn { background: var(--red); }
.preview { width: 60px; height: 60px; border: 1px solid var(--gold); object-fit: cover; margin: 5px 0; }
</style>
</head>
<body>

<div class="royal-card" id="form">
    <div class="crown-main">👑</div>
    <h1>TEAM SINGLE EMPIRE</h1>
    <p style="text-align:center; font-size:11px;">ROYAL eCITIZEN PORTAL • EST. 2026</p>
    <div class="stats">Loyal Subjects: <span id="liveCount">0</span> 👑</div>
    
    <input id="jina" placeholder="Royal Name">
    <input id="oshwa" placeholder="Date of Last Betrayal">
    <input id="embassy" placeholder="Territory • Embassy yako">
    <label style="font-size:12px; color:#B8941F;">Official Portrait:</label>
    <input type="file" id="photo" accept="image/*">
    <img id="photoPreview" class="preview hidden">

    <button type="button" onclick="generate()">👑 CLAIM CITIZENSHIP 👑</button>
    <button type="button" onclick="showAdmin()" style="background:#333; color:var(--gold);">ROYAL ADMIN</button>
</div>

<div class="royal-card hidden" id="passport">
    <div class="crown-main">👑</div>
    <h1>PASSPORT DECREED</h1>
    <div class="flex">
        <img id="passPhoto" class="photo-frame" src="">
        <div>
            <p><b>PASSPORT NO:</b> <span id="passNo"></span></p>
            <p><b>NAME:</b> <span id="passJina"></span></p>
            <p><b>STATUS:</b> Certified Single ✅</p>
            <p><b>EMBASSY:</b> <span id="passEmbassy"></span></p>
            <p><b>LAST BETRAYAL:</b> <span id="passOshwa"></span> 💀</p>
        </div>
    </div>
    <button type="button" onclick="window.print()">📜 DOWNLOAD</button>
    <button type="button" onclick="location.reload()">NEW APPLICATION</button>
</div>

<div class="royal-card hidden" id="admin">
    <h1>KING'S PRIVY COUNCIL 👑</h1>
    <p><b>Empire Population:</b> <span id="totalCitizens">0</span> Loyal Subjects</p>
    <button type="button" onclick="exportData()">EXPORT ROYAL CENSUS</button>
    <button type="button" onclick="clearDatabase()" class="admin-btn">💀 DISSOLVE EMPIRE 💀</button>
    <h3>Book of Citizens:</h3>
    <table id="citizenTable">
        <tr><th>No</th><th>Royal Name</th><th>Territory</th><th>Decree</th></tr>
    </table>
    <button type="button" onclick="location.reload()">CLOSE CHAMBER</button>
</div>

<script>
// EMPIRE DATABASE
let db = JSON.parse(localStorage.getItem('tseDB') || '[]');
let counter = parseInt(localStorage.getItem('tseCounter') || '5'); // TSE005 ndio last
document.getElementById('liveCount').innerText = db.length;

// PHOTO PREVIEW - HII NDIO FIX KUU KING
document.getElementById('photo').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('photoPreview').src = event.target.result;
            document.getElementById('photoPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }
});

function generate() {
    const jina = document.getElementById('jina').value.trim();
    const oshwa = document.getElementById('oshwa').value.trim();
    const embassy = document.getElementById('embassy').value.trim();
    const photoFile = document.getElementById('photo').files[0];

    if(!jina ||!oshwa ||!embassy) {
        alert('By Royal Decree: Jaza zote King! 👑');
        return;
    }

    counter++;
    const passNo = 'TSE' + String(counter).padStart(3, '0');

    // COMPRESS PICHA KWANZA - HII INAFANYA IFANYE KAZI MOBILE
    if(photoFile) {
        compressImage(photoFile, function(compressedDataUrl) {
            saveCitizen(passNo, jina, oshwa, embassy, compressedDataUrl);
        });
    } else {
        saveCitizen(passNo, jina, oshwa, embassy, '');
    }
}

// HII FUNCTION INAPUNGUZA SIZE YA PICHA - FIX YA MOBILE
function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            // Punguza hadi 300px max
            const maxSize = 300;
            let width = img.width;
            let height = img.height;
            
            if (width > height) {
                if (width > maxSize) {
                    height *= maxSize / width;
                    width = maxSize;
                }
            } else {
                if (height > maxSize) {
                    width *= maxSize / height;
                    height = maxSize;
                }
            }
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            // Compress 70% quality
            callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function saveCitizen(passNo, jina, oshwa, embassy, photoData) {
    const citizen = {
        no: passNo, jina: jina, oshwa: oshwa,
        embassy: embassy, photo: photoData,
        date: new Date().toLocaleDateString()
    };
    db.push(citizen);
    localStorage.setItem('tseDB', JSON.stringify(db));
    localStorage.setItem('tseCounter', counter);
    showPassport(citizen);
}

function showPassport(c) {
    document.getElementById('form').classList.add('hidden');
    document.getElementById('passport').classList.remove('hidden');
    document.getElementById('passNo').innerText = c.no;
    document.getElementById('passJina').innerText = c.jina.toUpperCase();
    document.getElementById('passEmbassy').innerText = c.embassy;
    document.getElementById('passOshwa').innerText = c.oshwa;
    document.getElementById('passPhoto').src = c.photo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110"><rect fill="%23111"/><text x="50%" y="50%" fill="%23D4AF37" font-size="10" text-anchor="middle" dy=".3em">SUBJECT</text></svg>';
}

function showAdmin() {
    const pass = prompt("Speak the Royal Password:");
    if(pass!== "smokie2026") {
        alert("Treason! Only the King may enter! 💀👑");
        return;
    }
    document.getElementById('form').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    loadAdminData();
}

function loadAdminData() {
    document.getElementById('totalCitizens').innerText = db.length;
    const table = document.getElementById('citizenTable');
    table.innerHTML = '<tr><th>No</th><th>Royal Name</th><th>Territory</th><th>Decree</th></tr>';
    db.forEach((c, i) => {
        table.innerHTML += `<tr>
            <td>${c.no}</td><td>${c.jina}</td><td>${c.embassy}</td>
            <td><button type="button" onclick="revokePassport(${i})" class="admin-btn">Banish</button></td>
        </tr>`;
    });
}

function revokePassport(index) {
    if(confirm(`Banish ${db[index].jina} from the Empire? 💀`)) {
        db.splice(index, 1);
        localStorage.setItem('tseDB', JSON.stringify(db));
        loadAdminData();
        document.getElementById('liveCount').innerText = db.length;
    }
}

function exportData() {
    let csv = 'Passport No,Royal Name,Territory,Last Betrayal,Date Ennobled\n';
    db.forEach(c => {
        csv += `${c.no},"${c.jina}",${c.embassy},${c.oshwa},${c.date}\n`;
    });
    const blob = new Blob([csv], {type: 'text/csv'});
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'TeamSingleEmpire_RoyalCensus.csv'; a.click();
}

function clearDatabase() {
    if(confirm("KING, SHALL WE DISSOLVE THE ENTIRE EMPIRE? 💀")) {
        localStorage.removeItem('tseDB');
        localStorage.setItem('tseCounter', '5');
        db = [];
        loadAdminData();
        document.getElementById('liveCount').innerText = 0;
    }
}
</script>

</body>
</html>
